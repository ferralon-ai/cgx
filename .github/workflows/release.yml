# release.yml — mints a dated BUSL LICENSE at release time and ships a
# reproducible cgx binary built from that dated commit.
#
# Mint mechanic (Eric-decided, see dispatch 02):
#   - A tag `vX.Y.Z` is pushed pointing at commit T (already on main).
#   - This workflow creates a STAMP commit S that is a *child of T*,
#     author-dated to T's own author date, whose only change is filling in
#     LICENSE's `Change Date:` (T's date + 4 years). S is NEVER merged to
#     main — main stays exactly as it was tagged.
#   - The tag `vX.Y.Z` is then force-moved to point at S instead of T.
#   - The release binary is built FROM S (so the shipped tarball's LICENSE
#     file is the dated one, not the `TBD` one that's actually on main/T).
#
# Release notes (required): the human-written description of the release must
# exist at `docs/releases/<tag>.md`, committed on main before the tag is
# pushed. The workflow reads it from the tagged commit and uses it verbatim
# (plus a Change-Date footnote) as BOTH the stamp commit message and the
# GitHub Release body; a missing or empty file fails the run. See
# docs/releases/README.md for the process.
#
# Re-entrancy: moving the tag with the workflow's own GITHUB_TOKEN does NOT
# recursively retrigger this workflow — GitHub does not fire new workflow
# runs for pushes made with the default GITHUB_TOKEN. The "already stamped"
# guard below is defense in depth in case this ever runs with a PAT instead.

name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write # needed to move the tag and create the GitHub Release

env:
  TARGET: x86_64-unknown-linux-gnu
  BIN_NAME: cgx

jobs:
  stamp-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history: commit-tree needs the tagged commit's tree/parent
          ref: ${{ github.ref }}

      - name: Resolve tagged commit
        id: tagged
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          TAGGED_SHA="$(git rev-parse "${TAG}^{commit}")"
          AUTHOR_DATE_ISO="$(git show -s --format=%aI "${TAGGED_SHA}")"   # e.g. 2026-09-09T13:25:00-07:00
          AUTHOR_NAME="$(git show -s --format=%an "${TAGGED_SHA}")"
          AUTHOR_EMAIL="$(git show -s --format=%ae "${TAGGED_SHA}")"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "sha=${TAGGED_SHA}" >> "$GITHUB_OUTPUT"
          echo "author_date=${AUTHOR_DATE_ISO}" >> "$GITHUB_OUTPUT"
          echo "author_name=${AUTHOR_NAME}" >> "$GITHUB_OUTPUT"
          echo "author_email=${AUTHOR_EMAIL}" >> "$GITHUB_OUTPUT"

      - name: Compute Change Date (tagged commit date + 4 years)
        id: change_date
        env:
          SRC_DATE: ${{ steps.tagged.outputs.author_date }}
        run: |
          set -euo pipefail
          # date -d needs GNU coreutils (ubuntu-latest has it). The Change
          # Date is "author date + 4 years" on the AS-AUTHORED calendar date
          # — so we operate on the date component only (strip at "T", no
          # `-u`). Reinterpreting the tz-local timestamp in UTC first (the
          # previous approach) can shift the calendar date by a day
          # depending on the author's offset; this is tz-independent.
          SRC_DAY="${SRC_DATE%%T*}"
          CHANGE_DATE="$(date -d "${SRC_DAY} +4 years" +%Y-%m-%d)"
          echo "date=${CHANGE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Load release notes (fail if missing)
        id: notes
        env:
          TAGGED_SHA: ${{ steps.tagged.outputs.sha }}
          TAG: ${{ steps.tagged.outputs.tag }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
        run: |
          set -euo pipefail
          # The human-written description of this release. It is committed on
          # main *before* the tag is pushed (see docs/releases/README.md), so
          # we read it from the TAGGED commit's tree — independent of any
          # checkout state — and fail fast if it is absent or empty. Both the
          # stamp commit message and the GitHub Release body are built from it.
          NOTES_PATH="docs/releases/${TAG}.md"
          if ! git cat-file -e "${TAGGED_SHA}:${NOTES_PATH}" 2>/dev/null; then
            echo "::error::Release notes not found at ${NOTES_PATH} for ${TAG}. Write them before tagging — see docs/releases/README.md." >&2
            exit 1
          fi
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          git show "${TAGGED_SHA}:${NOTES_PATH}" > "${BODY_FILE}"
          # A present-but-blank file is as useless as a missing one.
          if ! grep -q '[^[:space:]]' "${BODY_FILE}"; then
            echo "::error::Release notes ${NOTES_PATH} is empty." >&2
            exit 1
          fi
          # Append the mint footnote: what the LICENSE Change Date was stamped
          # to for this release. Kept identical in the commit message and the
          # release body. BODY_FILE lives under RUNNER_TEMP (outside the repo),
          # so the `git checkout` in the stamp step never sees or disturbs it.
          {
            printf '\n---\n\n'
            printf "This release's BUSL-1.1 Change Date is stamped %s 00:00:00Z (converts to MIT on that date).\n" "${CHANGE_DATE}"
          } >> "${BODY_FILE}"
          echo "body_file=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Idempotency guard — is the tag already stamped?
        id: guard
        env:
          TAGGED_SHA: ${{ steps.tagged.outputs.sha }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
        run: |
          set -euo pipefail
          # If LICENSE at the tagged commit already has a non-TBD Change Date
          # equal to what we'd compute, this tag was already stamped by a
          # prior run of this workflow (e.g. a re-run, or a retrigger from a
          # PAT-based tag push). Skip straight to build-from-current-tag
          # instead of stamping/moving the tag again.
          CURRENT_LICENSE_LINE="$(git show "${TAGGED_SHA}:LICENSE" | grep '^Change Date:' || true)"
          if echo "${CURRENT_LICENSE_LINE}" | grep -q "${CHANGE_DATE}"; then
            echo "already_stamped=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_stamped=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create stamp commit (child of tagged commit, author-dated to it)
        if: steps.guard.outputs.already_stamped == 'false'
        id: stamp
        env:
          TAGGED_SHA: ${{ steps.tagged.outputs.sha }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
          AUTHOR_NAME: ${{ steps.tagged.outputs.author_name }}
          AUTHOR_EMAIL: ${{ steps.tagged.outputs.author_email }}
          AUTHOR_DATE: ${{ steps.tagged.outputs.author_date }}
          TAG: ${{ steps.tagged.outputs.tag }}
          BODY_FILE: ${{ steps.notes.outputs.body_file }}
        run: |
          set -euo pipefail

          # Materialize the tagged tree in the index/worktree so we can edit
          # LICENSE without disturbing anything else.
          git checkout --quiet "${TAGGED_SHA}"

          # Edit ONLY the Change Date line; preserve column alignment and
          # every other byte of LICENSE untouched. Change License is already
          # "MIT" in the body per the mint mechanic — this asserts that
          # rather than silently accepting drift.
          if ! grep -q '^Change License:       MIT$' LICENSE; then
            echo "::error::LICENSE Change License line is not 'MIT' as expected — aborting stamp" >&2
            exit 1
          fi
          sed -i "s/^Change Date:.*\$/Change Date:          ${CHANGE_DATE}/" LICENSE

          # Sanity: exactly one FILE changed by the sed above, and it's
          # LICENSE. `git diff --stat` emits TWO lines for a single-file
          # change (the "LICENSE | 2 +-" line plus the "1 file changed..."
          # summary line), so counting stat lines always aborts here — count
          # changed files via --name-only instead.
          CHANGED="$(git diff --name-only -- LICENSE | wc -l | tr -d ' ')"
          if [ "${CHANGED}" -ne 1 ]; then
            echo "::error::LICENSE diff touched an unexpected number of files (${CHANGED})" >&2
            git diff --stat -- LICENSE >&2
            exit 1
          fi

          git add LICENSE
          NEW_TREE="$(git write-tree)"

          # Author date AND committer date are both pinned to the ORIGINAL
          # tagged commit's author date, so the stamp SHA is deterministic
          # across re-runs (same tree + parent + author-date + committer-date
          # + identities + message ⇒ same commit-tree hash every time).
          STAMP_SHA="$(GIT_AUTHOR_NAME="${AUTHOR_NAME}" \
            GIT_AUTHOR_EMAIL="${AUTHOR_EMAIL}" \
            GIT_AUTHOR_DATE="${AUTHOR_DATE}" \
            GIT_COMMITTER_NAME="cgx-release-bot" \
            GIT_COMMITTER_EMAIL="release@ferralon.com" \
            GIT_COMMITTER_DATE="${AUTHOR_DATE}" \
            git commit-tree "${NEW_TREE}" -p "${TAGGED_SHA}" \
              -F "${BODY_FILE}")"

          echo "sha=${STAMP_SHA}" >> "$GITHUB_OUTPUT"

      - name: Re-point the tag at the stamp commit
        if: steps.guard.outputs.already_stamped == 'false'
        env:
          TAG: ${{ steps.tagged.outputs.tag }}
          STAMP_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail

          # Move the local tag ref, then force-push it. This does NOT touch
          # any branch — main is never advanced, checked out, or merged into.
          # `git push --force` on a TAG ref only overwrites that one ref.
          git tag -f "${TAG}" "${STAMP_SHA}"
          git push --force origin "refs/tags/${TAG}"

      - name: Resolve build ref (stamp commit, or already-stamped tag)
        id: build_ref
        env:
          ALREADY_STAMPED: ${{ steps.guard.outputs.already_stamped }}
          TAGGED_SHA: ${{ steps.tagged.outputs.sha }}
          STAMP_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${ALREADY_STAMPED}" = "true" ]; then
            echo "sha=${TAGGED_SHA}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${STAMP_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout stamp commit for the build
        env:
          BUILD_SHA: ${{ steps.build_ref.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --quiet "${BUILD_SHA}"
          # Confirm we are building from the dated LICENSE, not TBD.
          grep '^Change Date:' LICENSE

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0" # keep in sync with rust-toolchain.toml — see NOTES.md
          targets: ${{ env.TARGET }}

      - name: Reproducible build
        run: |
          chmod +x ./reproducible-build.sh
          ./reproducible-build.sh "${TARGET}"
        # reproducible-build.sh is expected to live at repo root once this
        # draft is applied for real; see NOTES.md for where it's copied from.

      - name: Package tarball (binary + dated LICENSE)
        id: package
        env:
          TAG: ${{ steps.tagged.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="dist/${BIN_NAME}-${TAG}-${TARGET}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/${BIN_NAME}" "${STAGE}/"
          cp LICENSE "${STAGE}/LICENSE"      # the DATED LICENSE from the stamp commit
          cp README.md "${STAGE}/README.md" 2>/dev/null || true

          # Deterministic archive: the binary is already reproducible
          # (reproducible-build.sh), but tar/gzip wrappers are not by
          # default — gzip stamps its own mtime in the header, and tar
          # records file mtimes/uid/gid and (absent a sort) directory
          # iteration order, so a byte-identical binary can still produce a
          # different .tar.gz. Pin all of that so the published .sha256 is a
          # real third-party-reproducible attestation of the TARBALL, not
          # just the binary inside it. GNU tar (--sort, --mtime, --owner,
          # --group, --numeric-owner) and GNU gzip (-n) are both available
          # on ubuntu-latest.
          #
          # Recompute SOURCE_DATE_EPOCH the same way reproducible-build.sh
          # did (git log -1 --format=%at HEAD) — HEAD here is still the
          # build commit checked out earlier in the job.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%at HEAD)"
          TAR="dist/${BIN_NAME}-${TAG}-${TARGET}.tar"
          TARBALL="${TAR}.gz"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -C dist -cf "${TAR}" "$(basename "${STAGE}")"
          gzip -n -9 "${TAR}"   # -n: no name/mtime in the gzip header
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

      - name: Create/update GitHub Release and attach tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.tagged.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          BODY_FILE: ${{ steps.notes.outputs.body_file }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Re-run against an existing release: refresh assets and body from
            # the same source, so a re-run converges rather than leaving stale
            # notes behind.
            gh release upload "${TAG}" "${TARBALL}" "${TARBALL}.sha256" --clobber
            gh release edit "${TAG}" --notes-file "${BODY_FILE}"
          else
            gh release create "${TAG}" "${TARBALL}" "${TARBALL}.sha256" \
              --title "${TAG}" \
              --notes-file "${BODY_FILE}"
          fi
