# release.yml — mints a dated BUSL LICENSE at release time and ships a
# reproducible cgx binary built from that dated commit.
#
# Two ways to cut a release, one shared mint/build/publish path:
#
#   • push a tag `vX.Y.Z` (forward release) — the tagged commit is on main and
#     already carries this workflow. The cleave point is the tagged commit.
#
#   • run it via workflow_dispatch (backfill) — supply `version`, `cleave_sha`,
#     and `publication_date`. Runs from main (which has this workflow), so the
#     cleave point can be ANY historical commit, including ones that predate
#     this file. This is how v0.1.0 / v0.2.0 are minted from old cleave points.
#
# Mint mechanic (Eric-decided, see dispatch 02):
#   - The cleave point is a commit C.
#   - This workflow creates a STAMP commit S that is a *child of C*,
#     author-dated to C's own author date, whose only change is filling in
#     LICENSE's `Change Date:`. S is NEVER merged to main — main is untouched.
#   - The tag `vX.Y.Z` is (re)created as an ANNOTATED tag pointing at S, dated
#     to the publication date.
#   - The release binary is built FROM S, so the shipped tarball's LICENSE is
#     the dated one, not the `TBD` one on main.
#
# Change Date basis (publication, not authorship): Change Date = publication
# date + 4 years. For a forward tag-push, the publication date is the tag's own
# date (annotated tagger date if present, else the cleave commit's author date —
# which for a fresh release is "today"). For a backfill, it is the explicit
# `publication_date` input. This keeps every version's Change Date keyed to when
# it was actually published, not to when its code happened to be authored.
#
# Release notes (required): the human-written description must exist at
# `docs/releases/<tag>.md` ON MAIN. The workflow reads it from origin/main
# (independent of the cleave point, so backfills work) and uses it verbatim,
# plus an auto-appended Change-Date footnote, as BOTH the stamp commit message
# and the GitHub Release body. A missing or empty file fails the run. See
# docs/releases/README.md.
#
# Re-entrancy / idempotency: the stamp SHA is deterministic (fixed tree, parent,
# author/committer dates, identities, and message), so re-running converges on
# the same commit. The guard below additionally short-circuits to a plain
# rebuild when the tag already points at a correctly-stamped commit.

name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag to create, e.g. v0.1.0"
        required: true
      cleave_sha:
        description: "Commit (SHA or ref) to cut the release from"
        required: true
      publication_date:
        description: "Publication date YYYY-MM-DD; Change Date = this + 4 years"
        required: true
        default: "2026-09-10"

permissions:
  contents: write # needed to create/move the tag and the GitHub Release

env:
  TARGET: x86_64-unknown-linux-gnu
  BIN_NAME: cgx

jobs:
  stamp-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history, tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # commit-tree needs the cleave commit's tree/parent; full history for old cleave points

      - name: Resolve release parameters
        id: params
        env:
          EVENT: ${{ github.event_name }}
          IN_VERSION: ${{ github.event.inputs.version }}
          IN_CLEAVE: ${{ github.event.inputs.cleave_sha }}
          IN_PUBDATE: ${{ github.event.inputs.publication_date }}
        run: |
          set -euo pipefail
          # Make main and all tags resolvable regardless of which ref triggered
          # us (a tag-push checks out the tag; a dispatch checks out main).
          git fetch --force origin "refs/heads/main:refs/remotes/origin/main"
          git fetch --force origin "refs/tags/*:refs/tags/*"

          if [ "${EVENT}" = "workflow_dispatch" ]; then
            TAG="${IN_VERSION}"
            CLEAVE_SHA="$(git rev-parse "${IN_CLEAVE}^{commit}")"
            PUB_DAY="${IN_PUBDATE}"
          else
            TAG="${GITHUB_REF_NAME}"
            CLEAVE_SHA="$(git rev-parse "${TAG}^{commit}")"
            # Publication day: annotated tagger date if the tag is annotated,
            # else the cleave commit's author date (for a fresh release, today).
            OBJTYPE="$(git cat-file -t "refs/tags/${TAG}" 2>/dev/null || echo commit)"
            if [ "${OBJTYPE}" = "tag" ]; then
              PUB_DAY="$(git for-each-ref --format='%(taggerdate:short)' "refs/tags/${TAG}")"
            else
              PUB_DAY="$(git show -s --format=%ad --date=short "${CLEAVE_SHA}")"
            fi
          fi

          case "${TAG}" in
            v*) ;;
            *) echo "::error::version/tag must start with 'v' (got '${TAG}')" >&2; exit 1 ;;
          esac
          case "${PUB_DAY}" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) echo "::error::publication date must be YYYY-MM-DD (got '${PUB_DAY}')" >&2; exit 1 ;;
          esac

          AUTHOR_DATE_ISO="$(git show -s --format=%aI "${CLEAVE_SHA}")"
          AUTHOR_NAME="$(git show -s --format=%an "${CLEAVE_SHA}")"
          AUTHOR_EMAIL="$(git show -s --format=%ae "${CLEAVE_SHA}")"
          {
            echo "tag=${TAG}"
            echo "cleave_sha=${CLEAVE_SHA}"
            echo "pub_day=${PUB_DAY}"
            echo "author_date=${AUTHOR_DATE_ISO}"
            echo "author_name=${AUTHOR_NAME}"
            echo "author_email=${AUTHOR_EMAIL}"
          } >> "$GITHUB_OUTPUT"

      - name: Compute Change Date (publication date + 4 years)
        id: change_date
        env:
          PUB_DAY: ${{ steps.params.outputs.pub_day }}
        run: |
          set -euo pipefail
          # GNU date (ubuntu-latest). Operate on the calendar date only — no
          # tz reinterpretation — so the Change Date can't drift by a day.
          CHANGE_DATE="$(date -d "${PUB_DAY} +4 years" +%Y-%m-%d)"
          echo "date=${CHANGE_DATE}" >> "$GITHUB_OUTPUT"

      - name: Load release notes from main (fail if missing)
        id: notes
        env:
          TAG: ${{ steps.params.outputs.tag }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
        run: |
          set -euo pipefail
          # Read from origin/main, NOT the cleave commit — the notes live on
          # main and a backfilled cleave point predates them. Fail fast if the
          # file is absent or empty. Both the stamp commit message and the
          # GitHub Release body are built from it.
          NOTES_PATH="docs/releases/${TAG}.md"
          if ! git cat-file -e "origin/main:${NOTES_PATH}" 2>/dev/null; then
            echo "::error::Release notes not found at ${NOTES_PATH} on main. Write them before releasing — see docs/releases/README.md." >&2
            exit 1
          fi
          BODY_FILE="${RUNNER_TEMP}/release-notes.md"
          git show "origin/main:${NOTES_PATH}" > "${BODY_FILE}"
          if ! grep -q '[^[:space:]]' "${BODY_FILE}"; then
            echo "::error::Release notes ${NOTES_PATH} is empty." >&2
            exit 1
          fi
          # Append the mint footnote: the LICENSE Change Date for this release.
          # Identical in the commit message and the release body. BODY_FILE is
          # under RUNNER_TEMP (outside the repo), so the stamp step's
          # `git checkout` never sees or disturbs it.
          {
            printf '\n---\n\n'
            printf "This release's BUSL-1.1 Change Date is stamped %s 00:00:00Z (converts to MIT on that date).\n" "${CHANGE_DATE}"
          } >> "${BODY_FILE}"
          echo "body_file=${BODY_FILE}" >> "$GITHUB_OUTPUT"

      - name: Idempotency guard — is the tag already stamped?
        id: guard
        env:
          TAG: ${{ steps.params.outputs.tag }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
        run: |
          set -euo pipefail
          # Already done iff the tag exists AND its commit's LICENSE already
          # carries the target Change Date. Covers re-runs on both paths (a
          # dispatch tag doesn't exist yet on the first run → not stamped).
          already=false
          if git rev-parse -q --verify "refs/tags/${TAG}^{commit}" >/dev/null 2>&1; then
            TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
            if git show "${TAG_COMMIT}:LICENSE" 2>/dev/null | grep -qE "^Change Date: +${CHANGE_DATE}\$"; then
              already=true
            fi
          fi
          echo "already_stamped=${already}" >> "$GITHUB_OUTPUT"

      - name: Create stamp commit (child of cleave, author-dated to it)
        if: steps.guard.outputs.already_stamped == 'false'
        id: stamp
        env:
          CLEAVE_SHA: ${{ steps.params.outputs.cleave_sha }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
          AUTHOR_NAME: ${{ steps.params.outputs.author_name }}
          AUTHOR_EMAIL: ${{ steps.params.outputs.author_email }}
          AUTHOR_DATE: ${{ steps.params.outputs.author_date }}
          BODY_FILE: ${{ steps.notes.outputs.body_file }}
        run: |
          set -euo pipefail

          # Materialize the cleave tree so we can edit LICENSE without touching
          # anything else.
          git checkout --quiet "${CLEAVE_SHA}"

          # Edit ONLY the Change Date line; preserve column alignment and every
          # other byte. Change License must already be "MIT" — assert it rather
          # than accept drift.
          if ! grep -q '^Change License:       MIT$' LICENSE; then
            echo "::error::LICENSE Change License line is not 'MIT' as expected — aborting stamp" >&2
            exit 1
          fi
          sed -i "s/^Change Date:.*\$/Change Date:          ${CHANGE_DATE}/" LICENSE

          # Sanity: exactly one FILE changed, and it's LICENSE. Count changed
          # files via --name-only (--stat emits an extra summary line).
          CHANGED="$(git diff --name-only -- LICENSE | wc -l | tr -d ' ')"
          if [ "${CHANGED}" -ne 1 ]; then
            echo "::error::LICENSE diff touched an unexpected number of files (${CHANGED})" >&2
            git diff --stat -- LICENSE >&2
            exit 1
          fi

          git add LICENSE
          NEW_TREE="$(git write-tree)"

          # Author AND committer date pinned to the cleave commit's author date,
          # so the stamp SHA is deterministic across re-runs (same tree + parent
          # + dates + identities + message ⇒ same commit-tree hash).
          STAMP_SHA="$(GIT_AUTHOR_NAME="${AUTHOR_NAME}" \
            GIT_AUTHOR_EMAIL="${AUTHOR_EMAIL}" \
            GIT_AUTHOR_DATE="${AUTHOR_DATE}" \
            GIT_COMMITTER_NAME="cgx-release-bot" \
            GIT_COMMITTER_EMAIL="release@ferralon.com" \
            GIT_COMMITTER_DATE="${AUTHOR_DATE}" \
            git commit-tree "${NEW_TREE}" -p "${CLEAVE_SHA}" \
              -F "${BODY_FILE}")"

          echo "sha=${STAMP_SHA}" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag at the stamp commit
        if: steps.guard.outputs.already_stamped == 'false'
        env:
          TAG: ${{ steps.params.outputs.tag }}
          STAMP_SHA: ${{ steps.stamp.outputs.sha }}
          PUB_DAY: ${{ steps.params.outputs.pub_day }}
          CHANGE_DATE: ${{ steps.change_date.outputs.date }}
        run: |
          set -euo pipefail
          # Annotated tag dated to the publication day (midnight UTC). -f so a
          # forward tag-push (whose lightweight tag already exists) is converted
          # to this annotated tag at the stamp. Force-pushing a TAG ref touches
          # no branch — main is never advanced, checked out, or merged into.
          GIT_COMMITTER_NAME="cgx-release-bot" \
          GIT_COMMITTER_EMAIL="release@ferralon.com" \
          GIT_COMMITTER_DATE="${PUB_DAY}T00:00:00Z" \
            git tag -f -a "${TAG}" "${STAMP_SHA}" \
              -m "cgx ${TAG}" \
              -m "BUSL-1.1 Change Date: ${CHANGE_DATE} (converts to MIT)."
          git push --force origin "refs/tags/${TAG}"

      - name: Resolve build ref (stamp, or already-stamped tag)
        id: build_ref
        env:
          ALREADY_STAMPED: ${{ steps.guard.outputs.already_stamped }}
          TAG: ${{ steps.params.outputs.tag }}
          STAMP_SHA: ${{ steps.stamp.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "${ALREADY_STAMPED}" = "true" ]; then
            echo "sha=$(git rev-parse "${TAG}^{commit}")" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${STAMP_SHA}" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout stamp commit for the build
        env:
          BUILD_SHA: ${{ steps.build_ref.outputs.sha }}
        run: |
          set -euo pipefail
          git checkout --quiet "${BUILD_SHA}"
          # Confirm we build from the dated LICENSE, not TBD.
          grep '^Change Date:' LICENSE

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.96.0" # keep in sync with rust-toolchain.toml
          targets: ${{ env.TARGET }}

      - name: Reproducible build
        run: |
          chmod +x ./reproducible-build.sh
          ./reproducible-build.sh "${TARGET}"

      - name: Package tarball (binary + dated LICENSE)
        id: package
        env:
          TAG: ${{ steps.params.outputs.tag }}
        run: |
          set -euo pipefail
          STAGE="dist/${BIN_NAME}-${TAG}-${TARGET}"
          mkdir -p "${STAGE}"
          cp "target/${TARGET}/release/${BIN_NAME}" "${STAGE}/"
          cp LICENSE "${STAGE}/LICENSE"      # the DATED LICENSE from the stamp commit
          cp README.md "${STAGE}/README.md" 2>/dev/null || true

          # Deterministic archive so the published .sha256 is a real
          # third-party-reproducible attestation of the TARBALL, not just the
          # binary inside it. GNU tar + gzip -n on ubuntu-latest. Recompute
          # SOURCE_DATE_EPOCH the same way reproducible-build.sh did
          # (git log -1 --format=%at HEAD) — HEAD is still the build commit.
          SOURCE_DATE_EPOCH="$(git log -1 --format=%at HEAD)"
          TAR="dist/${BIN_NAME}-${TAG}-${TARGET}.tar"
          TARBALL="${TAR}.gz"
          tar --sort=name --mtime="@${SOURCE_DATE_EPOCH}" \
              --owner=0 --group=0 --numeric-owner \
              -C dist -cf "${TAR}" "$(basename "${STAGE}")"
          gzip -n -9 "${TAR}"   # -n: no name/mtime in the gzip header
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"

      - name: Create/update GitHub Release and attach tarball
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.params.outputs.tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
          BODY_FILE: ${{ steps.notes.outputs.body_file }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            # Re-run against an existing release: refresh assets and body from
            # the same source so a re-run converges rather than leaving stale
            # content behind.
            gh release upload "${TAG}" "${TARBALL}" "${TARBALL}.sha256" --clobber
            gh release edit "${TAG}" --notes-file "${BODY_FILE}"
          else
            gh release create "${TAG}" "${TARBALL}" "${TARBALL}.sha256" \
              --title "${TAG}" \
              --notes-file "${BODY_FILE}"
          fi
