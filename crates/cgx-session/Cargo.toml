[package]
name = "cgx-session"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cgx resident session: warm-open a persisted index, index and hold the graph in memory, and answer the MCP tool set plus bulk export and batched selector resolution over it. Shared by the wasm module and the native `cgx session` verb."
publish = false

[dependencies]
cgx-core.workspace = true
cgx-frontend.workspace = true
cgx-index = { path = "../cgx-index" }
cgx-mcp = { path = "../cgx-mcp" }
cgx-query = { path = "../cgx-query" }
cgx-resolve = { path = "../cgx-resolve" }
cgx-select = { path = "../cgx-select" }
cgx-store = { path = "../cgx-store" }
serde.workspace = true
serde_json = "1"
sha1 = "0.10"

[dev-dependencies]
tempfile = "3"
