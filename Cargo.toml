[workspace]
resolver = "2"
members = ["crates/*", "xtask"]

[workspace.package]
edition = "2021"
license = "BUSL-1.1"
repository = "https://github.com/ferralon-ai/cgx"
rust-version = "1.96"

[workspace.dependencies]
cgx-core = { path = "crates/cgx-core" }
cgx-frontend = { path = "crates/cgx-frontend" }
cgx-scip = { path = "crates/cgx-scip" }
serde = { version = "1", features = ["derive"] }
postcard = { version = "1", features = ["use-std"] }
smallvec = { version = "1", features = ["serde"] }
thiserror = "2"
tree-sitter = "0.26"

# Grammar crates (parse layer). Pinned at WP-03; lang adapters reuse these.
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23"
tree-sitter-python = "0.25"
tree-sitter-go = "0.25"
tree-sitter-json = "0.24"

# Dev-dependencies shared across crates
proptest = "1"
