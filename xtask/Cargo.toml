[package]
name = "xtask"
version = "0.2.0"
edition = "2021"
description = "Build tooling: eval harness, determinism checks, bench"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
cgx-core.workspace = true
cgx-doctor = { path = "../crates/cgx-doctor" }
cgx-index = { path = "../crates/cgx-index" }
cgx-query = { path = "../crates/cgx-query" }
cgx-store = { path = "../crates/cgx-store" }
cgx-transport = { path = "../crates/cgx-transport" }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
tempfile = "3"
walkdir = "2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
