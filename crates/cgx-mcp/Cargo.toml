[package]
name = "cgx-mcp"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cgx MCP STDIO server: a deterministic, read-only JSON-RPC 2.0 server (initialize/tools/list/tools/call) exposing the cgx-query callers/callees/paths/unused/explain tools to AI agents, with a per-call include_dirty working-tree overlay (ADR-06)."

[dependencies]
cgx-core.workspace = true
cgx-index = { path = "../cgx-index" }
cgx-query = { path = "../cgx-query" }
cgx-store = { path = "../cgx-store" }
serde = { workspace = true }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
