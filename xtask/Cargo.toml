[package]
name = "xtask"
version = "0.2.0"
edition = "2021"
description = "Build tooling: eval harness, determinism checks, bench"

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
walkdir = "2"
