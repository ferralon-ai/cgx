[package]
name = "cgx-transport"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cgx ref-overlay transport: promotes the content-addressed .cgx committable set into git's native object DB under refs/cgx/index (subprocess git plumbing, no libgit2) and materializes it back on pull with per-object integrity verification."

[dependencies]
cgx-core.workspace = true
cgx-store = { path = "../cgx-store" }
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
assert_cmd = "2"
serde_json = "1"
