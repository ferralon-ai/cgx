[package]
name = "cgx-lang-c"
version = "0.3.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "cgx C language adapter: tree-sitter-c frontend emitting symbol defs (functions/structs/unions/enums/typedefs/globals), call refs with enclosing-scope attribution, edge conditions, entrypoints, effects, includes, and grammar-only preprocessor handling."

[dependencies]
cgx-core.workspace = true
cgx-frontend.workspace = true
smallvec.workspace = true
tree-sitter.workspace = true
tree-sitter-c.workspace = true

[dev-dependencies]
cgx-resolve = { path = "../cgx-resolve" }
