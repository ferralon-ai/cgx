name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test --workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  determinism:
    name: determinism gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo run -p xtask -- determinism

  wasm:
    name: wasm32 module
    runs-on: ubuntu-latest
    # Two fat-LTO builds: the second, from a copy of the checkout at another
    # path, starts from an empty target dir.
    timeout-minutes: 60
    env:
      # The C toolchain for tree-sitter and SQLite on wasm32-wasip1; xtask wasm
      # refuses any other version. sha256 of the release asset.
      WASI_SDK_VERSION: "34.0"
      WASI_SDK_SHA256: b761e3a0721dbae9c09a0059e5fdb2bf917d1b4a8a7b430fb3b5aafb0984b2c4
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Cache wasi-sdk archive
        uses: actions/cache@v4
        with:
          path: ~/.cache/wasi-sdk
          key: wasi-sdk-${{ env.WASI_SDK_VERSION }}-x86_64-linux-${{ env.WASI_SDK_SHA256 }}
      - name: Install wasi-sdk
        run: |
          set -euo pipefail
          # The archive is verified on every run, cached or not.
          archive="$HOME/.cache/wasi-sdk/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          if [ ! -f "$archive" ]; then
            mkdir -p "$(dirname "$archive")"
            curl -sSfL -o "$archive" \
              "https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION%%.*}/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux.tar.gz"
          fi
          echo "${WASI_SDK_SHA256}  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          sdk="$RUNNER_TEMP/wasi-sdk-${WASI_SDK_VERSION}-x86_64-linux"
          {
            echo "WASI_SDK_PATH=$sdk"
            echo "CC_wasm32_wasip1=$sdk/bin/clang"
            echo "AR_wasm32_wasip1=$sdk/bin/llvm-ar"
            echo "CFLAGS_wasm32_wasip1=--sysroot=$sdk/share/wasi-sysroot"
          } >> "$GITHUB_ENV"
      - run: cargo clippy --target wasm32-wasip1 -p cgx-wasm -- -D warnings
      - name: Build cgx.wasm twice from different paths (fails unless byte-identical)
        run: |
          set -euo pipefail
          cargo run --locked -p xtask -- wasm --check-reproducible --out "$RUNNER_TEMP/cgx.wasm"
          sha256sum "$RUNNER_TEMP/cgx.wasm"
      - uses: actions/upload-artifact@v4
        with:
          name: cgx-wasm
          path: ${{ runner.temp }}/cgx.wasm
          if-no-files-found: error
          retention-days: 14

  go-sdk:
    name: Go SDK
    needs: wasm
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the native engine
        run: cargo build --release --locked -p cgx-cli
      - uses: actions/setup-go@v5
        with:
          go-version-file: sdk/go/go.mod
          cache-dependency-path: sdk/go/go.sum
      # Into the embed directory, so the tests exercise the embedded module as
      # a release build of the SDK does.
      - uses: actions/download-artifact@v4
        with:
          name: cgx-wasm
          path: sdk/go/internal/embedded/module
      - name: Committed schema matches the engine's dump
        run: |
          set -euo pipefail
          target/release/cgx mcp --print-schemas > "$RUNNER_TEMP/tools.json"
          diff -u sdk/go/schema/tools.json "$RUNNER_TEMP/tools.json"
      - name: gofmt, go vet, go generate
        working-directory: sdk/go
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
          go generate ./...
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::go generate changed the tree; commit its output"
            git status --porcelain -- .
            git diff -- .
            exit 1
          fi
      - name: go test -race (conformance on both transports)
        working-directory: sdk/go
        env:
          CGX_REQUIRE_WASM: "1"
          CGX_REQUIRE_NATIVE: "1"
        run: CGX_BIN="$GITHUB_WORKSPACE/target/release/cgx" go test -race -count=1 ./...
